version: '3.7'

networks:
  evigraph_net:
    name: evigraph_net

volumes:
  orderer.evigraph.police.gov:
  peer0.org1.evigraph.police.gov:

services:
  orderer.evigraph.police.gov:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.evigraph.police.gov
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - orderer.evigraph.police.gov:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
    networks:
      - evigraph_net

  peer0.org1.evigraph.police.gov:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.org1.evigraph.police.gov
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.org1.evigraph.police.gov
      - CORE_PEER_ADDRESS=peer0.org1.evigraph.police.gov:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.evigraph.police.gov:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.evigraph.police.gov:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.evigraph.police.gov:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=evigraph_net
      - CORE_PEER_TLS_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer0.org1.evigraph.police.gov:/var/hyperledger/production
    ports:
      - "7051:7051"
    networks:
      - evigraph_net

  cli:
    image: hyperledger/fabric-tools:2.5
    container_name: evigraph_cli
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.org1.evigraph.police.gov:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=false
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../backend/services/blockchain/evidence_chaincode:/opt/gopath/src/github.com/chaincode
    networks:
      - evigraph_net
