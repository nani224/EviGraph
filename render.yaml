services:
  - type: web
    name: evigraph
    runtime: python
    buildCommand: "cd 'SIH 2026/SIH26/frontend' && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd 'SIH 2026/SIH26' && python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
